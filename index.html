<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Storage Bins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- wobbly pencil-line filters used by every drawn edge -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="3" result="wob"/>
      <feDisplacementMap in="SourceGraphic" in2="wob" scale="5" result="a"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="8" result="grit"/>
      <feDisplacementMap in="a" in2="grit" scale="3.2"/>
    </filter>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="9" result="wob"/>
      <feDisplacementMap in="SourceGraphic" in2="wob" scale="4" result="a"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="2" result="grit"/>
      <feDisplacementMap in="a" in2="grit" scale="2.6"/>
    </filter>
    <filter id="rough-text" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </svg>

  <main class="stage">
    <header class="tagline">
      <p>welcome to my corner of the internet, where you can check out some of my favorite things :)</p>
    </header>
    <div class="cabinet" id="cabinet"></div>
  </main>

  <div class="gallery" id="gallery" hidden></div>
  <figure class="lightbox" id="lightbox" hidden>
    <img alt="">
    <figcaption></figcaption>
  </figure>

  <script src="script.js"></script>
</body>
</html>
